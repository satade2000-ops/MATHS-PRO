<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="2">
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
  </g>

  <!-- Math Pro Centerpiece (Sigma & Symbols) -->
  <g filter="url(#dropGlow)">
    <!-- Central Sigma ∑ -->
    <path d="M 330 150 L 180 150 L 260 256 L 180 362 L 330 362" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Small Golden Star on Top Right -->
    <path d="M 360 110 L 368 128 L 388 130 L 372 144 L 377 163 L 360 153 L 343 163 L 348 144 L 332 130 L 352 128 Z" 
          fill="url(#goldGrad)" />

    <!-- Corner Math Symbols -->
    <text x="80" y="120" fill="#34D399" font-family="sans-serif" font-size="44" font-weight="900">+</text>
    <text x="400" y="270" fill="#F472B6" font-family="sans-serif" font-size="48" font-weight="900">×</text>
    <text x="90" y="420" fill="#FBBF24" font-family="sans-serif" font-size="52" font-weight="900">÷</text>
    <text x="390" y="420" fill="#60A5FA" font-family="sans-serif" font-size="44" font-weight="900">−</text>
  </g>
</svg>
